<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#5a0f33"/>
      <stop offset="1" stop-color="#14060d"/>
    </radialGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d8f"/>
      <stop offset="1" stop-color="#c2105c"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#e0a51b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <circle cx="200" cy="112" r="92" fill="#ff3d8f" opacity="0.18"/>
  <!-- phone -->
  <rect x="150" y="34" width="100" height="176" rx="16" fill="#1d1a24" stroke="#3b3546" stroke-width="3"/>
  <rect x="158" y="46" width="84" height="152" rx="9" fill="url(#app)"/>
  <rect x="186" y="38" width="28" height="4" rx="2" fill="#3b3546"/>
  <!-- wallet mark -->
  <circle cx="200" cy="104" r="28" fill="#fff"/>
  <text x="200" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#e2136e">৳</text>
  <text x="200" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#fff">bKash</text>
  <text x="200" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#ffd1e4" letter-spacing="1.5">REWARD</text>
  <!-- coins -->
  <g>
    <ellipse cx="96" cy="182" rx="30" ry="10" fill="#b8820f"/>
    <rect x="66" y="166" width="60" height="16" fill="#d79a17"/>
    <ellipse cx="96" cy="166" rx="30" ry="10" fill="url(#coin)"/>
    <ellipse cx="96" cy="160" rx="30" ry="10" fill="#b8820f"/>
    <rect x="66" y="144" width="60" height="16" fill="#d79a17"/>
    <ellipse cx="96" cy="144" rx="30" ry="10" fill="url(#coin)"/>
    <text x="96" y="149" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9a6a06">৳</text>
  </g>
  <g>
    <circle cx="306" cy="92" r="24" fill="url(#coin)" stroke="#b8820f" stroke-width="3"/>
    <text x="306" y="101" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a6a06">৳</text>
    <circle cx="326" cy="160" r="16" fill="url(#coin)" stroke="#b8820f" stroke-width="2.5"/>
    <text x="326" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9a6a06">৳</text>
  </g>
  <g fill="#ffe27a">
    <path d="M300 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z"/>
    <path d="M86 70 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z"/>
  </g>
</svg>
