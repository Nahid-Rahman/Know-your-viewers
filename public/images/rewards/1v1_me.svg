<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b1220"/>
      <stop offset="1" stop-color="#1a0509"/>
    </linearGradient>
    <linearGradient id="blue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f7a"/>
      <stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <linearGradient id="vs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff9a1f"/>
    </linearGradient>
  </defs>
  <!-- split background -->
  <path d="M0 0 H230 L170 240 H0 Z" fill="url(#red)"/>
  <path d="M230 0 H400 V240 H170 Z" fill="url(#blue)"/>
  <path d="M230 0 L170 240" stroke="#ffe27a" stroke-width="4"/>
  <!-- left player (headset) -->
  <g fill="#ff4f6a">
    <circle cx="96" cy="104" r="34"/>
    <path d="M40 240 C40 176 64 150 96 150 C128 150 152 176 152 240 Z"/>
  </g>
  <path d="M60 104 C60 62 132 62 132 104" fill="none" stroke="#1a0509" stroke-width="7"/>
  <rect x="52" y="96" width="14" height="24" rx="6" fill="#1a0509"/>
  <rect x="126" y="96" width="14" height="24" rx="6" fill="#1a0509"/>
  <!-- right player (cap) -->
  <g fill="#3fa3ff">
    <circle cx="306" cy="104" r="34"/>
    <path d="M250 240 C250 176 274 150 306 150 C338 150 362 176 362 240 Z"/>
  </g>
  <path d="M272 96 C272 68 340 68 340 96 Z" fill="#050d1c"/>
  <rect x="262" y="92" width="44" height="8" rx="4" fill="#050d1c"/>
  <!-- VS -->
  <circle cx="200" cy="120" r="40" fill="#0c0b10" stroke="url(#vs)" stroke-width="4"/>
  <text x="200" y="134" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="900" font-style="italic" fill="url(#vs)">VS</text>
  <text x="200" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#fff" letter-spacing="2">1v1</text>
</svg>
