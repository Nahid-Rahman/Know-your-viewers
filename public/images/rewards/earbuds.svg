<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2d1b5e"/>
      <stop offset="1" stop-color="#0b0816"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f2fa"/>
      <stop offset="1" stop-color="#bdb7cf"/>
    </linearGradient>
    <linearGradient id="bud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9c3da"/>
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
  <circle cx="200" cy="124" r="96" fill="#a66bff" opacity="0.16"/>
  <!-- charging case -->
  <ellipse cx="200" cy="200" rx="72" ry="9" fill="#000" opacity="0.5"/>
  <rect x="132" y="118" width="136" height="80" rx="36" fill="url(#case)"/>
  <path d="M132 146 H268" stroke="#9c95b2" stroke-width="2"/>
  <circle cx="200" cy="172" r="4" fill="#3ee08f"/>
  <!-- left bud -->
  <g transform="rotate(-18 150 78)">
    <circle cx="150" cy="70" r="24" fill="url(#bud)"/>
    <rect x="142" y="78" width="16" height="44" rx="8" fill="url(#bud)"/>
    <circle cx="150" cy="66" r="10" fill="#2b2540"/>
  </g>
  <!-- right bud -->
  <g transform="rotate(18 250 78)">
    <circle cx="250" cy="70" r="24" fill="url(#bud)"/>
    <rect x="242" y="78" width="16" height="44" rx="8" fill="url(#bud)"/>
    <circle cx="250" cy="66" r="10" fill="#2b2540"/>
  </g>
  <!-- sound waves -->
  <g fill="none" stroke="#a66bff" stroke-width="3" stroke-linecap="round">
    <path d="M104 50 C94 62 94 80 104 92"/>
    <path d="M90 40 C74 58 74 84 90 102" opacity="0.6"/>
    <path d="M296 50 C306 62 306 80 296 92"/>
    <path d="M310 40 C326 58 326 84 310 102" opacity="0.6"/>
  </g>
</svg>
